<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestor de Tareas</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f8; margin: 0; }
    main { max-width: 560px; margin: 40px auto; background: #fff; padding: 24px;
           border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    h1 { margin-top: 0; color: #1f3a5f; }
    form.nueva { display: flex; gap: 8px; margin-bottom: 20px; }
    input[type=text] { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 8px 12px; border: 0; border-radius: 6px; cursor: pointer; background: #1f6feb; color: #fff; }
    button.sec { background: #e5e7eb; color: #111; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #eee; }
    li span { flex: 1; }
    .hecha { text-decoration: line-through; color: #888; }
    footer { margin-top: 16px; font-size: 12px; color: #888; }
  </style>
</head>
<body>
<main>
  <h1>Gestor de Tareas</h1>
  <form class="nueva" method="post">
    {% csrf_token %}
    <input type="text" name="titulo" placeholder="Nueva tarea..." required>
    <button type="submit">Agregar</button>
  </form>
  <ul>
    {% for tarea in tareas %}
      <li>
        <span class="{% if tarea.completada %}hecha{% endif %}">{{ tarea.titulo }}</span>
        <form method="post" action="{% url 'alternar' tarea.pk %}">{% csrf_token %}
          <button class="sec">{% if tarea.completada %}Reabrir{% else %}Completar{% endif %}</button>
        </form>
        <form method="post" action="{% url 'eliminar' tarea.pk %}">{% csrf_token %}
          <button class="sec">Eliminar</button>
        </form>
      </li>
    {% empty %}
      <li>No hay tareas todavía.</li>
    {% endfor %}
  </ul>
  <footer>Django + PostgreSQL + Docker · Práctica de Gestión de la Configuración de Software</footer>
</main>
</body>
</html>
