name: CI Django

on:
  push:
    branches: [main, ci-setup]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Pruebas (Django + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tareasdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: tareasdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar migraciones pendientes
        run: python manage.py makemigrations --check --dry-run

      - name: Ejecutar pruebas
        run: python manage.py test --verbosity 2

  build:
    name: Build de imagen Docker
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: |
          docker build -t gestor-tareas:latest -t gestor-tareas:${{ github.sha }} .
          docker images gestor-tareas

      - name: Exportar imagen como archivo
        run: docker save gestor-tareas:latest | gzip > gestor-tareas-image.tar.gz

      - name: Guardar artefacto en GitHub
        uses: actions/upload-artifact@v4
        with:
          name: gestor-tareas-image
          path: gestor-tareas-image.tar.gz
          retention-days: 7

      - name: Preparar publicación en DockerHub (simulado)
        run: |
          echo "Comandos que se ejecutarían para publicar en DockerHub:"
          echo "docker login -u USUARIO_DOCKERHUB"
          echo "docker tag gestor-tareas:latest USUARIO_DOCKERHUB/gestor-tareas:${{ github.sha }}"
          echo "docker push USUARIO_DOCKERHUB/gestor-tareas:${{ github.sha }}"
